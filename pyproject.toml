[project]
name = "trivy-kev-epss-action"
version = "1.0.0"
description = "Enrich a Trivy JSON report with CISA KEV and FIRST EPSS, render a summary, and gate on exploitation evidence."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Fog&Frog" }]
keywords = ["trivy", "kev", "epss", "github-actions", "vulnerability", "security"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "ruff>=0.15"]

[project.urls]
Repository = "https://github.com/fogandfrog/trivy-kev-epss-action"
Issues = "https://github.com/fogandfrog/trivy-kev-epss-action/issues"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures", "tests/live"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "PIE", # flake8-pie
  "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["trivy_kev_epss"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
